server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 215M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://myboot-app:80/myboot/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/upboard/(upList|upboardAdd|updetail|upcommList|upcommAdd)$ {
    proxy_pass http://myboot-app:80/myboot$uri$is_args$args;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    }
    
    location /imgfile/ {
        proxy_pass http://myboot-app:80/myboot/imgfile/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
